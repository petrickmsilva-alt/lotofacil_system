name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit pip-audit

      - name: Testes (pytest)
        run: pytest -q --cov=core --cov=database --cov=app --cov-report=term

      - name: Segurança do código (bandit)
        run: bandit -q -r app.py core database -x tests --severity-level medium || true

      - name: Vulnerabilidades de dependências (pip-audit)
        run: pip-audit -r requirements.txt
