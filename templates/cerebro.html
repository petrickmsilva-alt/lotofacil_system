{% extends base_layout|default("base.html") %}
{% block title %}Cérebro IA — Inteligência Magna{% endblock %}
{% block page_title %}
    <i class="fas fa-brain"></i> Cérebro IA <small style="opacity:.7;font-weight:400;">· Inteligência Magna</small>
{% endblock %}

{% block content %}

<!-- Abas unificadas: todas as áreas de geração/análise passam pelo Cérebro -->
<div class="cerebro-tabs" id="cerebro-tabs">
    <button class="ctab active" data-aba="central">
        <i class="fas fa-robot"></i> Cabine
    </button>
    <button class="ctab" data-aba="gerar">
        <i class="fas fa-dice"></i> Gerar Cartelas
    </button>
    <button class="ctab" data-aba="cartela_do_dia">
        <i class="fas fa-eye"></i> Cartela do Dia
    </button>
    <button class="ctab" data-aba="wheeling">
        <i class="fas fa-diagram-project"></i> Wheeling 14/15
    </button>
    <button class="ctab" data-aba="analise">
        <i class="fas fa-chart-bar"></i> Análise
    </button>
    <button class="ctab" data-aba="singularidade">
        <i class="fas fa-atom"></i> Singularidade
    </button>
    <button class="ctab" data-aba="auditoria">
        <i class="fas fa-microscope"></i> Auditoria
    </button>
</div>

<div id="cerebro-conteudo" class="cerebro-conteudo">
    <div class="cerebro-loading" style="text-align:center;padding:40px;color:var(--text-muted);">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top:12px;">Carregando módulo do Cérebro...</p>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
(function () {
    var CONTEUDO = document.getElementById('cerebro-conteudo');
    var botoes = document.querySelectorAll('.ctab');
    var ABA_PADRAO = 'central';

    // Mapa de abas → rota que devolve o fragmento (conteúdo + scripts)
    var ROTAS = {
        'central':        '/cerebro/central',
        'gerar':          '/gerar?fragmento=1',
        'cartela_do_dia': '/cartela_do_dia?fragmento=1',
        'wheeling':       '/wheeling?fragmento=1',
        'analise':        '/analise?fragmento=1',
        'singularidade':  '/singularidade?fragmento=1',
        'auditoria':      '/ia_auditoria?fragmento=1'
    };

    function ativarBotao(aba) {
        botoes.forEach(function (b) {
            b.classList.toggle('active', b.dataset.aba === aba);
        });
    }

    function executaScripts(el) {
        // Os fragmentos trazem <script>; quando injetados via innerHTML os
        // scripts não executam sozinhos — re-executamos na ordem.
        var scripts = el.querySelectorAll('script');
        scripts.forEach(function (old) {
            var novo = document.createElement('script');
            if (old.src) { novo.src = old.src; }
            else { novo.textContent = old.textContent; }
            old.parentNode.replaceChild(novo, old);
        });
    }

    function carregar(aba, push) {
        var url = ROTAS[aba];
        if (!url) { return; }
        ativarBotao(aba);
        CONTEUDO.innerHTML =
            '<div style="text-align:center;padding:40px;color:var(--text-muted);">' +
            '<i class="fas fa-spinner fa-spin fa-2x"></i>' +
            '<p style="margin-top:12px;">Processando no Cérebro...</p></div>';
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function (r) {
                if (!r.ok) { throw new Error('HTTP ' + r.status); }
                return r.text();
            })
            .then(function (html) {
                CONTEUDO.innerHTML = html;
                executaScripts(CONTEUDO);
                if (push) { history.replaceState({ aba: aba }, '', '#aba-' + aba); }
                CONTEUDO.scrollTop = 0;
            })
            .catch(function (e) {
                CONTEUDO.innerHTML =
                    '<div class="alert alert-danger">Erro ao carregar módulo: ' +
                    (e && e.message ? e.message : e) + '</div>';
            });
    }

    botoes.forEach(function (b) {
        b.addEventListener('click', function () {
            carregar(b.dataset.aba, true);
        });
    });

    // Intercepta navegação de links/formulários DENTRO do fragmento para que
    // continuem dentro do hub (em vez de trocar a página inteira).
    document.addEventListener('click', function (ev) {
        var a = ev.target.closest('a');
        if (!a) { return; }
        var href = a.getAttribute('href') || '';
        if (href.charAt(0) !== '/') { return; }
        // links que já são fragmentos de aba
        for (var aba in ROTAS) {
            var rota = ROTAS[aba].split('?')[0];
            if (href === rota || href.indexOf(rota + '?') === 0) {
                ev.preventDefault();
                carregar(aba, true);
                return;
            }
        }
    });

    function abaInicial() {
        var hash = (location.hash || '').replace('#aba-', '');
        if (hash && ROTAS[hash]) { return hash; }
        return ABA_PADRAO;
    }

    window.addEventListener('popstate', function (e) {
        if (e.state && e.state.aba) { carregar(e.state.aba, false); }
    });

    carregar(abaInicial(), true);
})();
</script>

<style>
.cerebro-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 2px solid var(--border, #2a2d42);
    margin-bottom: 20px;
}
.ctab {
    background: transparent; border: none; cursor: pointer;
    padding: 12px 16px; color: var(--text-muted, #9aa0b4);
    font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent;
    transition: all .15s;
}
.ctab:hover { color: var(--text, #e6e8ef); }
.ctab.active { color: var(--primary, #6c5ce7); border-bottom-color: var(--primary, #6c5ce7); }
.cerebro-conteudo { min-height: 200px; }
</style>
{% endblock %}
